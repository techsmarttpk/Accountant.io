services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accountant
      POSTGRES_PASSWORD: accountant
      POSTGRES_DB: accountant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accountant"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://accountant:accountant@db:5432/accountant
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env
    environment:
      BACKEND_BASE_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
